<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Milano Leverkusen</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="navbar-milano">
      <div class="nav-container">
        <div class="logo-box">
          <span class="logo-top">Milano</span>
          <span class="logo-bottom">PIZZERIA</span>
        </div>

        <button class="delivery-area" id="delivery-trigger">
          <span class="material-symbols-outlined pin-icon">location_on</span>
          <span class="delivery-text">
            Liefergebiet: <strong>51371</strong>
            <span class="change-link">(Ändern)</span>
          </span>
        </button>

        <button class="cart-box" id="cart-trigger">
          <span class="material-symbols-outlined cart-icon">shopping_cart</span>
          <span class="cart-count">0</span>
        </button>
      </div>
    </header>
    <script src="js/script.js"></script>
  </body>
</html>
